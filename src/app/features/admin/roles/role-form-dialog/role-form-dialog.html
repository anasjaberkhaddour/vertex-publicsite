@if (open()) {
  <div class="dialog-overlay" (click)="cancel()">
    <div class="dialog" (click)="$event.stopPropagation()">

      <header class="dialog__header">
        <h2>{{ (isEdit() ? 'admin.roles.editRole' : 'admin.roles.addRole') | transloco }}</h2>
        <button class="dialog__close" (click)="cancel()">✕</button>
      </header>

      <form (ngSubmit)="submit($event)" class="dialog__form">

        @if (!isEdit()) {
          <div class="form-field">
            <label>{{ 'admin.roles.roleName' | transloco }}</label>
            <input type="text" [(ngModel)]="form.name" name="name"
                   placeholder="Manager" required />
          </div>
        } @else {
          <div class="form-field">
            <label>{{ 'admin.roles.roleName' | transloco }}</label>
            <input type="text" [value]="form.name" disabled />
          </div>
        }

        <div class="form-field">
          <label>{{ 'admin.roles.description' | transloco }}</label>
          <textarea rows="2" [(ngModel)]="form.description" name="description"></textarea>
        </div>

        <div class="form-field">
          <label>{{ 'admin.roles.permissions' | transloco }}</label>
          <div class="permissions-list">
            @for (p of permissions(); track p.id) {
              <label class="perm-chip" [class.active]="isSelected(p.id)">
                <input type="checkbox"
                       [checked]="isSelected(p.id)"
                       (change)="togglePermission(p.id)" />
                <span class="perm-chip__name">{{ p.name }}</span>
                @if (p.description) {
                  <span class="perm-chip__desc">{{ p.description }}</span>
                }
              </label>
            }
          </div>
        </div>

        <footer class="dialog__footer">
          <button type="button" class="btn btn--ghost" (click)="cancel()">
            {{ 'admin.common.cancel' | transloco }}
          </button>
          <button type="submit" class="btn btn--primary" [disabled]="loading()">
            {{ (loading() ? 'admin.common.saving' : 'admin.common.save') | transloco }}
          </button>
        </footer>
      </form>

    </div>
  </div>
}
