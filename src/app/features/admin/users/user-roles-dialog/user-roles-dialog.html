@if (open() && user()) {
    <div class="dialog-overlay" (click)="cancel()">
      <div class="dialog" (click)="$event.stopPropagation()">
  
        <header class="dialog__header">
          <h2>أدوار: {{ user()!.fullName }}</h2>
          <button class="dialog__close" (click)="cancel()">✕</button>
        </header>
  
        <div class="dialog__body">
          <p class="dialog__hint">اختر الأدوار المطلوبة:</p>
          <div class="roles-list">
            @for (r of roles(); track r.id) {
              <label class="role-chip" [class.active]="isSelected(r.name)">
                <input type="checkbox" [checked]="isSelected(r.name)" (change)="toggle(r.name)" />
                <span>{{ r.name }}</span>
              </label>
            }
          </div>
        </div>
  
        <footer class="dialog__footer">
          <button class="btn btn--ghost" (click)="cancel()">إلغاء</button>
          <button class="btn btn--primary" (click)="save()" [disabled]="loading()">
            {{ loading() ? 'جارٍ الحفظ...' : 'حفظ' }}
          </button>
        </footer>
  
      </div>
    </div>
  }
