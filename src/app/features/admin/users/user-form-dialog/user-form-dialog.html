@if (open()) {
  <div class="dialog-overlay" (click)="cancel()">
    <div class="dialog" (click)="$event.stopPropagation()">

      <header class="dialog__header">
        <h2>{{ (isEdit() ? 'admin.users.editUser' : 'admin.users.addUser') | transloco }}</h2>
        <button class="dialog__close" (click)="cancel()">✕</button>
      </header>

      <form (ngSubmit)="submit($event)" class="dialog__form">

        <div class="form-field">
          <label>{{ 'admin.users.fullName' | transloco }}</label>
          <input type="text" [(ngModel)]="form.fullName" name="fullName" required />
        </div>

        @if (!isEdit()) {
          <div class="form-field">
            <label>{{ 'admin.users.email' | transloco }}</label>
            <input type="email" [(ngModel)]="form.email" name="email" required dir="ltr" />
          </div>

          <div class="form-field">
            <label>{{ 'admin.users.password' | transloco }}</label>
            <input type="password" [(ngModel)]="form.password" name="password"
                   [placeholder]="'admin.users.passwordHint' | transloco" required />
          </div>
        }

        <div class="form-field">
          <label>{{ 'admin.users.roles' | transloco }}</label>
          <div class="roles-list">
            @for (r of roles(); track r.id) {
              <label class="role-chip" [class.active]="isRoleSelected(r.name)">
                <input type="checkbox"
                       [checked]="isRoleSelected(r.name)"
                       (change)="toggleRole(r.name)" />
                <span>{{ r.name }}</span>
              </label>
            }
          </div>
        </div>

        <footer class="dialog__footer">
          <button type="button" class="btn btn--ghost" (click)="cancel()">
            {{ 'admin.common.cancel' | transloco }}
          </button>
          <button type="submit" class="btn btn--primary" [disabled]="loading()">
            {{ (loading() ? 'admin.common.saving' : 'admin.common.save') | transloco }}
          </button>
        </footer>
      </form>

    </div>
  </div>
}
