@if (open() && user()) {
    <div class="dialog-overlay" (click)="cancel()">
      <div class="dialog" (click)="$event.stopPropagation()">
  
        <header class="dialog__header">
          <h2>تغيير كلمة مرور: {{ user()!.fullName }}</h2>
          <button class="dialog__close" (click)="cancel()">✕</button>
        </header>
  
        <form (ngSubmit)="submit($event)" class="dialog__form">
  
          <div class="form-field">
            <label>كلمة المرور الجديدة</label>
            <input type="password" [(ngModel)]="newPassword" name="newPassword"
                   placeholder="8 أحرف، حرف كبير وحرف صغير" required />
          </div>
  
          <div class="form-field">
            <label>تأكيد كلمة المرور</label>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />
          </div>
  
          @if (mismatch()) {
            <div class="dialog__warn">كلمتا المرور غير متطابقتين</div>
          }
  
          <footer class="dialog__footer">
            <button type="button" class="btn btn--ghost" (click)="cancel()">إلغاء</button>
            <button type="submit" class="btn btn--primary"
                    [disabled]="loading() || mismatch() || !newPassword">
              {{ loading() ? 'جارٍ الحفظ...' : 'حفظ' }}
            </button>
          </footer>
        </form>
  
      </div>
    </div>
  }
