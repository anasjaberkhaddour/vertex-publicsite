@if (open() && user()) {
  <div class="dialog-overlay" (click)="cancel()">
    <div class="dialog" (click)="$event.stopPropagation()">

      <header class="dialog__header">
        <h2>{{ 'admin.users.changePassword' | transloco }}: {{ user()!.fullName }}</h2>
        <button class="dialog__close" (click)="cancel()">✕</button>
      </header>

      <form (ngSubmit)="submit($event)" class="dialog__form">

        <div class="form-field">
          <label>{{ 'admin.users.newPassword' | transloco }}</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword"
                 [placeholder]="'admin.users.passwordHint' | transloco" required />
        </div>

        <div class="form-field">
          <label>{{ 'admin.users.confirmPassword' | transloco }}</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />
        </div>

        @if (mismatch()) {
          <div class="dialog__warn">{{ 'admin.users.mismatch' | transloco }}</div>
        }

        <footer class="dialog__footer">
          <button type="button" class="btn btn--ghost" (click)="cancel()">{{ 'admin.common.cancel' | transloco }}</button>
          <button type="submit" class="btn btn--primary"
                  [disabled]="loading() || mismatch() || !newPassword">
            {{ (loading() ? 'admin.common.saving' : 'admin.common.save') | transloco }}
          </button>
        </footer>
      </form>

    </div>
  </div>
}
