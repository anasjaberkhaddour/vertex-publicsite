@if (section(); as s) {
  <section class="modules" id="modules">
    <div class="container">

      <div class="modules__header">
        <span class="modules__badge">{{ s.subTitle }}</span>
        <h2 class="modules__title">{{ s.title }}</h2>
        <p class="modules__subtitle">{{ s.description }}</p>
      </div>

      <div class="modules__grid">
        @for (block of s.blocks; track block.id; let i = $index) {
          <article class="module-card" appReveal [appRevealDelay]="i * 60">
            <div class="module-card__icon">
              <svg [lucideIcon]="getIcon(block.icon)" [size]="24" [strokeWidth]="1.8"></svg>
            </div>
            <h3 class="module-card__title">{{ block.title }}</h3>
            <p class="module-card__desc">{{ block.description }}</p>
          </article>
        }
      </div>

    </div>
  </section>
}
