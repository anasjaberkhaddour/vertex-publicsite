<section class="hero" id="home">
    <div class="container hero__inner">
  
      <div class="hero__content">
        <span class="hero__badge">{{ 'hero.badge' | transloco }}</span>
        <h1 class="hero__title">{{ 'hero.title' | transloco }}</h1>
        <p class="hero__subtitle">{{ 'hero.subtitle' | transloco }}</p>
  
        <div class="hero__actions">
          <a href="#demo" class="btn btn--primary btn--lg">
            {{ 'hero.ctaPrimary' | transloco }}
          </a>
          <a href="#modules" class="btn btn--ghost btn--lg">
            {{ 'hero.ctaSecondary' | transloco }}
          </a>
        </div>
      </div>
  
      <div class="hero__visual">

        <!-- Desktop Mockup -->
        <div class="mockup-desktop">
          <div class="mockup-desktop__bar">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <div class="mockup-desktop__url"></div>
          </div>
          <div class="mockup-desktop__body">
      
            <!-- Sidebar -->
            <aside class="mockup-sidebar">
              <div class="mockup-sidebar__logo"></div>
              <div class="mockup-sidebar__item active"></div>
              <div class="mockup-sidebar__item"></div>
              <div class="mockup-sidebar__item"></div>
              <div class="mockup-sidebar__item"></div>
            </aside>
      
            <!-- Main Content -->
            <main class="mockup-main">
              <div class="mockup-main__header">
                <div class="mockup-main__title"></div>
                <div class="mockup-main__avatar"></div>
              </div>
      
              <div class="mockup-stats">
                <div class="mockup-stat">
                  <span class="mockup-stat__label"></span>
                  <span class="mockup-stat__value"></span>
                </div>
                <div class="mockup-stat">
                  <span class="mockup-stat__label"></span>
                  <span class="mockup-stat__value"></span>
                </div>
                <div class="mockup-stat">
                  <span class="mockup-stat__label"></span>
                  <span class="mockup-stat__value"></span>
                </div>
              </div>
      
              <div class="mockup-chart">
                <svg viewBox="0 0 300 100" preserveAspectRatio="none">
                  <defs>
                    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
                      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
                    </linearGradient>
                  </defs>
                  <path d="M0,80 L30,65 L60,70 L90,45 L120,50 L150,30 L180,38 L210,22 L240,28 L270,15 L300,20 L300,100 L0,100 Z"
                        fill="url(#chartGrad)"/>
                  <path d="M0,80 L30,65 L60,70 L90,45 L120,50 L150,30 L180,38 L210,22 L240,28 L270,15 L300,20"
                        fill="none" stroke="#3B82F6" stroke-width="2"/>
                </svg>
              </div>
      
              <div class="mockup-rows">
                <div class="mockup-row"><span class="mockup-row__dot"></span><span class="mockup-row__line"></span></div>
                <div class="mockup-row"><span class="mockup-row__dot"></span><span class="mockup-row__line short"></span></div>
              </div>
            </main>
      
          </div>
        </div>
      
        <!-- Mobile Mockup -->
        <div class="mockup-mobile">
          <div class="mockup-mobile__notch"></div>
          <div class="mockup-mobile__screen">
            <div class="mockup-mobile__header"></div>
            <div class="mockup-mobile__card"></div>
            <div class="mockup-mobile__card"></div>
            <div class="mockup-mobile__card short"></div>
            <div class="mockup-mobile__nav">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      
      </div>
  
    </div>
  </section>
