<section class="hero" id="home">
    <div class="container hero__inner">
  
      <div class="hero__content">
        <span class="hero__badge">{{ 'hero.badge' | transloco }}</span>
        <h1 class="hero__title">{{ 'hero.title' | transloco }}</h1>
        <p class="hero__subtitle">{{ 'hero.subtitle' | transloco }}</p>
  
        <div class="hero__actions">
          <a href="#demo" class="btn btn--primary btn--lg">
            {{ 'hero.ctaPrimary' | transloco }}
          </a>
          <a href="#modules" class="btn btn--ghost btn--lg">
            {{ 'hero.ctaSecondary' | transloco }}
          </a>
        </div>
      </div>
  
      <div class="hero__visual">
        <div class="hero__mockup">
          <div class="mockup__bar">
            <span></span><span></span><span></span>
          </div>
          <div class="mockup__body">
            <div class="mockup__sidebar"></div>
            <div class="mockup__content">
              <div class="mockup__row"></div>
              <div class="mockup__row"></div>
              <div class="mockup__row short"></div>
            </div>
          </div>
        </div>
      </div>
  
    </div>
  </section>
