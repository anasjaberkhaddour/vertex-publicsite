@if (section(); as s) {
  <section class="screenshots" id="screenshots">
    <div class="container">

      <div class="screenshots__header">
        <span class="screenshots__badge">{{ s.subTitle }}</span>
        <h2 class="screenshots__title">{{ s.title }}</h2>
        <p class="screenshots__subtitle">{{ s.description }}</p>
      </div>

      <div class="screenshots__carousel">
        <swiper-container
          #swiperRef
          [attr.dir]="transloco.getActiveLang() === 'ar' ? 'rtl' : 'ltr'"
          slides-per-view="1"
          space-between="0"
          centered-slides="true"
          loop="true"
          navigation="true"
          pagination="true"
          pagination-clickable="true"
          watch-slides-progress="true"
          observer="true"
          observe-parents="true"
          [breakpoints]="{
            '768': { slidesPerView: 1.2, spaceBetween: 24 },
            '1024': { slidesPerView: 1.5, spaceBetween: 32 }
          }"
        >
          @for (slide of slides(); track slide.id) {
            <swiper-slide>
              <figure class="shot">
                <div class="shot__frame">
                  <img [src]="imageUrl(slide.imagePath)" [alt]="slide.title" />
                </div>
                <figcaption class="shot__caption">
                  <h3>{{ slide.title }}</h3>
                  <p>{{ slide.description }}</p>
                </figcaption>
              </figure>
            </swiper-slide>
          }
        </swiper-container>
      </div>

    </div>
  </section>
}
