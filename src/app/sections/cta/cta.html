@if (section(); as s) {
  <section class="cta" id="demo">
    <div class="container">

      <div class="cta__box">
        <div class="cta__glow cta__glow--1"></div>
        <div class="cta__glow cta__glow--2"></div>

        <div class="cta__content">
          <h2 class="cta__title">{{ s.title }}</h2>
          <p class="cta__subtitle">{{ s.description }}</p>

          <div class="cta__actions">
            <a href="#contact" class="btn btn--light">
              {{ 'cta.primary' | transloco }}
            </a>
            <a href="#contact" class="btn btn--outline">
              {{ 'cta.secondary' | transloco }}
            </a>
          </div>
        </div>
      </div>

    </div>
  </section>
}
