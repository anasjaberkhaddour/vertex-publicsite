@if (section(); as s) {
  <section class="process" id="process">
    <div class="container">

      <div class="process__header">
        <span class="process__badge">{{ s.subTitle }}</span>
        <h2 class="process__title">{{ s.title }}</h2>
        <p class="process__subtitle">{{ s.description }}</p>
      </div>

      <div class="process__timeline">
        <div class="process__line"></div>

        @for (step of steps(); track step.id; let i = $index) {
          <div class="step" appReveal [appRevealDelay]="i * 200">
            <div class="step__marker">
              <span class="step__num">{{ (i + 1).toString().padStart(2, '0') }}</span>
              <svg class="step__icon" [lucideIcon]="getIcon(step.icon)" [size]="22" [strokeWidth]="1.8"></svg>
            </div>
            <div class="step__content">
              <h3 class="step__title">{{ step.title }}</h3>
              <p class="step__desc">{{ step.description }}</p>
            </div>
          </div>
        }
      </div>

    </div>
  </section>
}
