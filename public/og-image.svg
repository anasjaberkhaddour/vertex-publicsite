<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2A4F7A"/>
    </linearGradient>

    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glows -->
  <circle cx="1050" cy="100" r="300" fill="url(#glow1)"/>
  <circle cx="150" cy="550" r="280" fill="url(#glow2)"/>

  <!-- Decorative Grid Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Logo (inverted to white) -->
  <g transform="translate(400, 140) scale(0.42)" style="filter: brightness(0) invert(1);">
    <image href="/logo.png" width="1000" height="800"/>
  </g>

  <!-- Divider -->
  <rect x="500" y="380" width="200" height="3" fill="#3B82F6" rx="2"/>

  <!-- Main Title (Arabic) -->
  <text x="600" y="450"
        font-family="'Noto Kufi Arabic', 'Segoe UI', sans-serif"
        font-size="42"
        font-weight="700"
        fill="#FFFFFF"
        text-anchor="middle">
    منظومة ERP متكاملة لإدارة مؤسستك
  </text>

  <!-- Subtitle -->
  <text x="600" y="510"
        font-family="'Noto Kufi Arabic', 'Segoe UI', sans-serif"
        font-size="22"
        fill="#93C5FD"
        text-anchor="middle">
    +15 تطبيقاً مترابطاً · عربي وإنجليزي · أداء عالٍ
  </text>

  <!-- Bottom URL -->
  <text x="600" y="580"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="18"
        font-weight="500"
        fill="#FFFFFF"
        fill-opacity="0.5"
        text-anchor="middle">
    vertex-publicsite.vercel.app
  </text>
</svg>